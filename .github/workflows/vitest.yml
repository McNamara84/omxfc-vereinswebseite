name: JS Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    name: Vitest under PHP 8.5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.5'
          tools: composer:2.10.3@sha256:7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo, pdo_mysql, xdebug, sockets

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install NPM dependencies
        run: |
          npm install --global npm@12.2.0 --ignore-scripts
          test "$(npm --version)" = "12.2.0"
          npm ci

      - name: Run Vitest unit tests
        run: npm run test:vitest
        env:
          LARAVEL_BYPASS_ENV_CHECK: 1
      - name: Check asynchronous resource leaks
        run: npm run test:leaks
        env:
          LARAVEL_BYPASS_ENV_CHECK: 1
