name: JS Unit Tests
run-name: '${{ github.workflow }} @ ${{ github.sha }}'

on:
  merge_group:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'

permissions:
  contents: read

concurrency:
  group: vitest-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vitest:
    runs-on: ubuntu-latest
    name: Vitest under PHP 8.6
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        env:
          update: 'true'
        with:
          php-version: '8.6'
          tools: composer:2.11.2@sha256:dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028
          extensions: uri, zip, sockets
          coverage: none
      - name: Verify PHP 8.6 security minimum
        run: php tools/ci/verify-php86.php
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install NPM dependencies
        shell: bash
        run: |
          npm install --global npm@12.2.3 --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/vitest-global-install.log"
          node tools/testing/check-deprecations.mjs "$RUNNER_TEMP/vitest-global-install.log"
          test "$(npm --version)" = "12.2.3"
          sh docker/patch-npm-security.sh 2>&1 | tee "$RUNNER_TEMP/vitest-npm-security.log"
          node tools/testing/check-deprecations.mjs "$RUNNER_TEMP/vitest-npm-security.log"
          npm ci 2>&1 | tee "$RUNNER_TEMP/vitest-install.log"
          node tools/testing/check-deprecations.mjs "$RUNNER_TEMP/vitest-install.log"

      - name: Run Vitest tests once with coverage
        run: node tools/testing/check-deprecations.mjs --run node_modules/vitest/vitest.mjs run --config vitest.config.js --coverage
        env:
          LARAVEL_BYPASS_ENV_CHECK: 1
      - name: Fetch protected PR baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Compare JavaScript coverage
        # The base commit is fetched separately so checkout remains shallow.
        # The checker rejects both lowered floors and actual coverage losses.
        run: |
          node tools/testing/coverage.mjs js coverage/coverage-final.json coverage/js-snapshot.json
          node tools/testing/check-coverage.mjs tests/coverage-baselines/javascript.json coverage/js-snapshot.json
      - name: Upload JavaScript coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-coverage-summary
          path: coverage/
          if-no-files-found: error
      - name: Create JS coverage badge from the existing measurements
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm exec --no -- make-coverage-badge --report-path=coverage/coverage-summary.json --output-path=coverage/js-coverage.svg
          sed -i 's/Coverage/JS Coverage/' coverage/js-coverage.svg
      - name: Upload JavaScript coverage for badge publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-coverage-publication
          path: |
            coverage/coverage-summary.json
            coverage/js-coverage.svg
          if-no-files-found: error
      - name: Verify release gate and deployment preparation
        run: node tools/testing/check-deprecations.mjs --run --test tests/Node/*.test.mjs
      - name: Install Chromium for the native dialog pilot
        run: node tools/testing/check-deprecations.mjs --run node_modules/playwright/cli.js install --with-deps chromium
      - name: Test native dialog and focus with Chromium
        run: node tools/testing/check-deprecations.mjs --run node_modules/vitest/vitest.mjs run --config vitest.browser.config.js
      - name: Upload browser report and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-browser-report
          path: test-results/vitest-browser/
          if-no-files-found: ignore
      - name: Check asynchronous resource leaks
        if: github.event_name != 'pull_request'
        run: node tools/testing/check-deprecations.mjs --run node_modules/vitest/vitest.mjs run --config vitest.config.js --detectAsyncLeaks
        env:
          LARAVEL_BYPASS_ENV_CHECK: 1
