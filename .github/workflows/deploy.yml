name: Build and Deploy
on:
  push:
    branches: [ main ]
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      app-image: ghcr.io/mcnamara84/omxfc-vereinswebseite@${{ steps.build-and-push.outputs.digest }}
      typesense-image: ghcr.io/mcnamara84/omxfc-vereinswebseite@${{ steps.build-typesense.outputs.digest }}
      nginx-image: ghcr.io/mcnamara84/omxfc-vereinswebseite@${{ steps.build-nginx.outputs.digest }}
      database-image: ghcr.io/mcnamara84/omxfc-vereinswebseite@${{ steps.build-database.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Typesense with current OS security updates
        id: build-typesense
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/typesense.Dockerfile
          push: true
          no-cache: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/mcnamara84/omxfc-vereinswebseite:typesense-30.2
          labels: org.opencontainers.image.source=https://github.com/McNamara84/omxfc-vereinswebseite

      - name: Scan patched Typesense before deployment
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/mcnamara84/omxfc-vereinswebseite@${{ steps.build-typesense.outputs.digest }}
          grype-version: v0.120.1
          fail-build: true
          severity-cutoff: high
          output-format: table

      - name: Build and push Nginx with OS security updates
        id: build-nginx
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/nginx.Dockerfile
          push: true
          no-cache: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/mcnamara84/omxfc-vereinswebseite:nginx-1.30.5
          labels: org.opencontainers.image.source=https://github.com/McNamara84/omxfc-vereinswebseite

      - name: Scan patched Nginx before deployment
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/mcnamara84/omxfc-vereinswebseite@${{ steps.build-nginx.outputs.digest }}
          grype-version: v0.120.1
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      
      - name: Build and push MariaDB with image security hardening
        id: build-database
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/mariadb.Dockerfile
          push: true
          no-cache: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/mcnamara84/omxfc-vereinswebseite:mariadb-13.0.2
          labels: org.opencontainers.image.source=https://github.com/McNamara84/omxfc-vereinswebseite

      - name: Scan patched MariaDB before deployment
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/mcnamara84/omxfc-vereinswebseite@${{ steps.build-database.outputs.digest }}
          grype-version: v0.120.1
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - name: Verify pushed MariaDB initialization and data after restart
        run: bash docker/verify-mariadb-image.sh 'ghcr.io/mcnamara84/omxfc-vereinswebseite@${{ steps.build-database.outputs.digest }}'

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          push: true
          no-cache: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/mcnamara84/omxfc-vereinswebseite:latest
            ghcr.io/mcnamara84/omxfc-vereinswebseite:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/McNamara84/omxfc-vereinswebseite

      - name: Scan pushed image for fixable high and critical vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/mcnamara84/omxfc-vereinswebseite@${{ steps.build-and-push.outputs.digest }}
          grype-version: v0.120.1
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 125
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Require successful checks for this exact revision
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/wait-for-release-checks.mjs
      - name: Prepare reviewed deployment helper
        if: steps.checks.outputs.deploy == 'true'
        id: helper
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          appendFileSync(process.env.GITHUB_OUTPUT, 'script=' + readFileSync('docker/prepare-deployment.sh').toString('base64') + '\n');
          for (const name of ['recovery', 'retention']) {
            appendFileSync(process.env.GITHUB_OUTPUT, name + '=' + readFileSync(`docker/deployment-${name}.sh`).toString('base64') + '\n');
          }
          NODE
      - name: Deploy via SSH
        if: steps.checks.outputs.deploy == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/stacks/omxfc

            export OMXFC_APP_IMAGE='${{ needs.build.outputs.app-image }}'
            export OMXFC_TYPESENSE_IMAGE='${{ needs.build.outputs.typesense-image }}'
            export OMXFC_NGINX_IMAGE='${{ needs.build.outputs.nginx-image }}'
            export OMXFC_DATABASE_IMAGE='${{ needs.build.outputs.database-image }}'

            umask 077
            mkdir -p .deployment
            printf '%s' '${{ steps.helper.outputs.script }}' | base64 -d > .deployment/prepare-deployment.sh
            printf '%s' '${{ steps.helper.outputs.recovery }}' | base64 -d > .deployment/deployment-recovery.sh
            printf '%s' '${{ steps.helper.outputs.retention }}' | base64 -d > .deployment/deployment-retention.sh
            source .deployment/prepare-deployment.sh
            
            echo "Pulling new images..."
            $COMPOSE pull app queue scheduler db typesense nginx

            # Laravel 13.25 can pause all queues while the current job finishes.
            # Laravel 13.24 already exposes queue:pause, but does not support the
            # --all option, so detect the option itself for the first rollout.
            DEPLOYMENT_SERVICES_TOUCHED=1
            if docker exec maddrax-app php artisan queue:pause --help --no-ansi 2>/dev/null | grep -Fq -- "--all"; then
              echo "Pausing all queues before replacing containers..."
              docker exec maddrax-app php artisan queue:pause --all
              QUEUES_PAUSED=1
            else
              echo "Global queue pause is not available yet; relying on the graceful worker stop."
            fi

            echo "Stopping queue worker gracefully..."
            $COMPOSE stop --timeout 360 queue
            $COMPOSE exec -T app php artisan down
            $COMPOSE stop scheduler

            # Freeze HTTP writers as well as background writers before taking
            # the database dump and offline Typesense archive.
            echo "Stopping application services..."
            $COMPOSE stop app nginx
            backup_deployment_data
            
            # The digest-specific application volume is fresh. The previous
            # code volume remains available with the private rollback config.
            echo "Starting infrastructure containers..."
            DEPLOYMENT_INFRASTRUCTURE_CHANGED=1
            $COMPOSE up -d --force-recreate db typesense

            echo "Starting application container to initialize shared app volume..."
            $COMPOSE up -d --force-recreate --no-deps app

            echo "Starting web container..."
            $COMPOSE up -d --force-recreate --no-deps nginx
            
            echo "Waiting for containers to start..."
            sleep 15
            
            echo "Checking container status:"
            docker ps -a
            
            echo "Waiting for database to be ready (MariaDB upgrade may take a few minutes)..."
            DB_READY=0
            for i in {1..60}; do
              if docker exec maddrax-db sh -lc 'export MYSQL_PWD="${MARIADB_ROOT_PASSWORD:-${MYSQL_ROOT_PASSWORD:-}}"; test -n "$MYSQL_PWD" && mariadb -h 127.0.0.1 -uroot --batch --skip-column-names -e "SELECT 1"' >/dev/null 2>&1; then
                echo "Database is ready!"
                docker exec maddrax-db sh -lc 'export MYSQL_PWD="${MARIADB_ROOT_PASSWORD:-${MYSQL_ROOT_PASSWORD:-}}"; mariadb -uroot -e "SELECT VERSION();"'
                DB_READY=1
                break
              fi
              echo "Waiting for database... ($i/60)"
              sleep 5
            done

            if [ "$DB_READY" != "1" ]; then
              echo "Database did not become ready in time. Last database logs:"
              docker logs maddrax-db
              exit 1
            fi
            
            echo "Running Laravel setup commands..."
            
            # CRITICAL: Clear ALL caches FIRST - do this BEFORE any file operations
            echo "Clearing all caches BEFORE running any Laravel commands..."
            echo "Removing Laravel bootstrap cache files..."
            docker exec maddrax-app sh -lc 'rm -f /var/www/html/bootstrap/cache/*.php' || true
            docker exec maddrax-app sh -lc 'rm -rf /var/www/html/storage/framework/cache/*' || true
            docker exec maddrax-app sh -lc 'rm -rf /var/www/html/storage/framework/views/*' || true
            
            # Verify caches are gone
            echo "Verifying caches are removed..."
            docker exec maddrax-app ls -la /var/www/html/bootstrap/cache/ || true
            
            # Erstelle den Storage-Link
            docker exec maddrax-app php artisan storage:link || true
            
            # Führe Migrationen aus
            if docker exec maddrax-app php artisan migrate --force; then
              echo "Migrations completed successfully"
            else
              echo "Migration failed, checking logs..."
              docker logs maddrax-app
              exit 1
            fi
            
            # Cache-Management - REBUILD caches after migrations
            echo "Rebuilding caches..."
            docker exec maddrax-app php artisan config:cache
            docker exec maddrax-app php artisan route:cache
            docker exec maddrax-app php artisan view:cache
            
            # Kompendium-Index wiederherstellen falls nötig
            echo "Checking Kompendium search index..."
            docker exec maddrax-app php artisan kompendium:rebuild-index
            
            # Berechtigungen setzen
            echo "Setting permissions..."
            docker exec maddrax-app chown -R www-data:www-data /var/www/html/storage
            docker exec maddrax-app chmod -R 775 /var/www/html/storage

            # Keep writes paused until every release check succeeds. Laravel's
            # /up health route remains accessible during maintenance mode.
            if docker exec maddrax-app php artisan queue:pause --help --no-ansi 2>/dev/null | grep -Fq -- "--all"; then
              docker exec maddrax-app php artisan queue:pause --all
            fi
            
            # Start long-running workers only after migrations and the
            # configuration cache have been rebuilt. Otherwise they can retain
            # stale environment values for the lifetime of the process.
            echo "Starting background service containers..."
            $COMPOSE up -d --force-recreate --no-deps queue scheduler
            sleep 5

            # Gesundheitschecks
            echo "Running health checks..."

            echo "=== Verifying registered Laravel schedule ==="
            docker exec maddrax-app php artisan app:verify-schedule --no-ansi

            echo "=== Container Status ==="
            docker ps

            echo "=== Verifying background services ==="
            for service in queue scheduler; do
              if [ "$($COMPOSE ps --status running --services "$service")" = "$service" ]; then
                echo "✅ ${service}: RUNNING"
              else
                echo "❌ ${service}: NOT RUNNING"
                echo "=== ${service} logs ==="
                $COMPOSE logs --tail=50 "$service" || true
                exit 1
              fi
            done
            
            echo "=== Testing connectivity ==="
            # nginx veröffentlicht keinen Host-Port mehr (Traefik ist der einzige Eintrittspunkt).
            # Geprüft wird 1) der nginx-Container direkt und 2) der Weg über Traefik inkl. Zertifikat.
            if docker exec maddrax-nginx wget -q -O /dev/null http://127.0.0.1/up               && curl -fsS --max-time 20 --resolve maddrax-fanclub.de:443:127.0.0.1 https://maddrax-fanclub.de/up >/dev/null; then
              echo "✅ Connectivity test (nginx + Traefik): PASSED"
            else
              echo "❌ Connectivity test (nginx + Traefik): FAILED"
              echo "Container logs for debugging:"
              echo "=== Nginx logs ==="
              docker logs --tail=20 maddrax-nginx
              echo "=== App logs ==="
              docker logs --tail=20 maddrax-app
              exit 1
            fi
            
            echo "=== Verifying Livewire assets ==="
            if docker exec maddrax-app test -f /var/www/html/public/vendor/livewire/livewire.js; then
              echo "✅ Livewire assets: FOUND"
            else
              echo "❌ Livewire assets: MISSING"
              echo "Re-publishing Livewire assets..."
              docker exec maddrax-app php artisan vendor:publish --tag=livewire:assets --force
            fi

            # Release writes only after startup, migrations, caches, indexes,
            # workers, connectivity and assets have all been checked.
            if docker exec maddrax-app php artisan queue:resume --help --no-ansi 2>/dev/null | grep -Fq -- "--all"; then
              docker exec maddrax-app php artisan queue:resume --all
            fi
            QUEUES_PAUSED=0
            docker exec maddrax-app php artisan up
            trap - EXIT INT TERM

            # Cleanup is best effort after a successful release. Retain seven
            # days of complete rollback sets, plus the newest set and all
            # volumes/images still referenced by containers or retained sets.
            echo "=== Expiring deployment rollback sets ==="
            if ! cleanup_deployment_retention; then
              echo "⚠️ Some expired rollback resources could not be removed; retained for retry"
            fi
            echo "=== Pruning stale deployment images ==="
            if docker image prune --force --filter "until=168h" --filter "label=org.opencontainers.image.source=https://github.com/McNamara84/omxfc-vereinswebseite"; then
              echo "✅ Stale deployment images: PRUNED"
            else
              echo "⚠️ Stale deployment images could not be pruned"
            fi
            
            echo "🚀 Deployment completed successfully!"
