name: Pest TIA Baseline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: PHP 8.5 TIA Baseline

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.5'
          tools: composer:2.11.2@sha256:dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028
          extensions: gd, exif, zip, sockets
          coverage: pcov
      - name: Generate ephemeral application key
        run: php -r "file_put_contents(getenv('GITHUB_ENV'), 'APP_KEY=base64:'.base64_encode(random_bytes(32)).PHP_EOL, FILE_APPEND);"
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-8.5-tia-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-tia-composer-
            ${{ runner.os }}-php-8.5-composer-
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
      - name: Setup Node.js and build assets
        uses: ./.github/actions/build-assets
      - name: Resolve TIA baseline directory
        id: baseline-path
        run: echo "path=$(./vendor/bin/pest --baseline)" >> "$GITHUB_OUTPUT"
      - name: Record fresh Pest dependency graph
        env:
          DB_CONNECTION: sqlite
          # Match phpunit.tia.xml; inherited variables also populate $_SERVER.
          DB_DATABASE: ':memory:'
        # This workflow publishes the baseline. Re-record it without fetching
        # a previous artifact through gh, even on a runner with an empty cache.
        # Full-suite acceptance remains in phpunit.yml.
        run: composer test:tia:fresh
      - name: Verify recorded TIA graph
        env:
          TIA_GRAPH_DIRECTORY: ${{ steps.baseline-path.outputs.path }}
        run: php -r "json_decode(file_get_contents(getenv('TIA_GRAPH_DIRECTORY').'/graph.json'), true, 512, JSON_THROW_ON_ERROR);"
      - name: Upload TIA baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pest-tia-baseline
          path: ${{ steps.baseline-path.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
