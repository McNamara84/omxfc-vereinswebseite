name: Browser Tests
run-name: '${{ github.workflow }} @ ${{ github.sha }}'

on:
  merge_group:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      shuffle-seed:
        description: 'Optionaler numerischer Seed für einen reproduzierbaren Shuffle-Lauf'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Browser Tests (${{ matrix.browser }}, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOG_DEPRECATIONS_CHANNEL: php_deprecations
      LOG_DEPRECATIONS_WHILE_TESTING: 'true'
      LOG_DEPRECATIONS_TRACE: 'true'
    strategy:
      fail-fast: false
      matrix:
        # WebKit auf Linux CI ist instabil (Timeout-Probleme)
        browser: [chromium, firefox]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare PHP deprecation diagnostics
        run: |
          touch "$RUNNER_TEMP/php86-browser-deprecations.log" "$RUNNER_TEMP/php86-browser-deprecations.log.php.log"
          echo "PHP_DEPRECATIONS_LOG=$RUNNER_TEMP/php86-browser-deprecations.log" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        env:
          update: 'true'
        with:
          php-version: '8.6'
          tools: composer:2.11.2@sha256:dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028
          extensions: zip, sockets
          coverage: none
          ini-values: error_reporting=-1, log_errors=On, display_errors=stderr, error_log=${{ runner.temp }}/php86-browser-deprecations.log.php.log
      - name: Verify PHP 8.6 security minimum
        run: php tools/ci/verify-php86.php
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-playwright-composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Configure SQLite
        run: |
          if ! command -v sqlite3 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends sqlite3
          fi
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=database\/database.sqlite/' .env
          touch database/database.sqlite
      - run: php artisan migrate --force
      - name: Pin npm and install dependencies
        run: |
          npm install --global npm@12.2.3 --ignore-scripts
          test "$(npm --version)" = "12.2.3"
          sh docker/patch-npm-security.sh
          npm ci
      - run: npm run build
      - name: Verify build artifacts
        run: |
          test ! -f public/hot
          # shellcheck disable=SC2016
          php -r '
            $manifest = json_decode(file_get_contents("public/build/manifest.json"), true, 512, JSON_THROW_ON_ERROR);
            if (!$manifest || !array_all($manifest, static fn (array $entry): bool => is_file("public/build/".$entry["file"]))) {
              throw new RuntimeException("A build artifact is missing.");
            }
          '
      - name: Clear Laravel caches
        run: |
          php artisan config:clear
          php artisan view:clear
          php artisan route:clear
          php artisan cache:clear || true
      - run: node tools/testing/check-deprecations.mjs --run node_modules/playwright/cli.js install-deps ${{ matrix.browser }}
      - run: node tools/testing/check-deprecations.mjs --run node_modules/playwright/cli.js install ${{ matrix.browser }}
      - name: Verify native ARIA references with axe before the full suite
        run: node tools/testing/check-deprecations.mjs --run node_modules/playwright/cli.js test --config=playwright.aria.config.js --project=${{ matrix.browser }}
      - name: Run browser tests
        env:
          SHUFFLE_SEED: ${{ inputs.shuffle-seed }}
          BROWSER_PROJECT: ${{ matrix.browser }}
        run: |
          if [ -n "$SHUFFLE_SEED" ]; then
            case "$SHUFFLE_SEED" in *[!0-9]*) echo 'Shuffle seed must be numeric.'; exit 1 ;; esac
            echo "Playwright shuffle seed: $SHUFFLE_SEED"
            node tools/testing/check-deprecations.mjs --run node_modules/playwright/cli.js test --project="$BROWSER_PROJECT" --shard=${{ matrix.shard }}/2 --shuffle="$SHUFFLE_SEED"
          else
            node tools/testing/check-deprecations.mjs --run node_modules/playwright/cli.js test --project="$BROWSER_PROJECT" --shard=${{ matrix.shard }}/2
          fi
      - name: Reject PHP deprecations from browser and application processes
        if: ${{ !cancelled() }}
        run: php -d auto_prepend_file=tests/bootstrap.php tools/ci/verify-php86.php
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
            ${{ runner.temp }}/php86-browser-deprecations.log*
          if-no-files-found: ignore
          retention-days: 14
