name: Service image security scan

on:
  pull_request:
    paths:
      - Dockerfile
      - 'docker/**'
      - 'docker-compose*.yml'
      - '.github/workflows/service-image-scan.yml'
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: composer:2.10.3@sha256:b6dcd72ca98fa19d0e5b8476de179859704891fad06dd9e0b96833d4c430a5fc
            target: composer-bin
          - image: php:8.5.12-fpm-trixie@sha256:f49965c6e6a237eb3b27a6fc565e167839dc8abc65ee0652af0078f6ecdf4bbd
            target: php-base
          - image: php:8.5.12-cli-trixie@sha256:635a4b998025ab269194639a5549c6fdcd9b4f88ec8cd761b092de8653d40663
            target: playwright-php
            file: docker/playwright-php.Dockerfile
          - image: node:26.12.1-alpine3.24@sha256:40cd011b55415bc894e45b02fdd5a5dfde056921b7d23a64c74f80497af48797
            target: node-base
          - image: nginx:1.31.8-alpine3.24-slim@sha256:b899b0ef5345e14c01720a5ff83e716bacda65c7077a7363602ff7e7970bf88a
            target: nginx
            file: docker/nginx.Dockerfile
          - image: mariadb:13.0.2@sha256:0e4bb0f339feba125d1154fbacd36c16ec8518f52e44e1f82ecec7d6771caf39
            target: mariadb
            file: docker/mariadb.Dockerfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the patched stage actually used by the application
        if: matrix.target != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file || 'Dockerfile' }}
          target: ${{ matrix.target }}
          load: true
          no-cache: true
          tags: omxfc-service-base:security-scan
      - name: Verify MariaDB initialization and data after restart
        if: matrix.target == 'mariadb'
        run: bash docker/verify-mariadb-image.sh omxfc-service-base:security-scan
      - name: Verify MariaDB 12.3 upgrade and rollback
        if: matrix.target == 'mariadb'
        run: bash docker/verify-mariadb-upgrade.sh omxfc-service-base:security-scan
      - name: Report upstream findings separately
        if: matrix.target != ''
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ matrix.image }}
          grype-version: v0.121.0
          fail-build: false
          output-format: json
          output-file: upstream-grype-report.json
      - name: Report all vulnerabilities in ${{ matrix.image }}
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ matrix.target != '' && 'omxfc-service-base:security-scan' || matrix.image }}
          grype-version: v0.121.0
          # Keep unfixed findings visible; the next step enforces the deployment policy.
          # Scanner/database errors still fail this action with fail-build disabled.
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: grype-report.json
      - name: Block fixable high and critical vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ matrix.target != '' && 'omxfc-service-base:security-scan' || matrix.image }}
          grype-version: v0.121.0
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Summarize image vulnerabilities
        if: ${{ !cancelled() && steps.scan.outputs.json != '' }}
        env:
          SCAN_REPORT: ${{ steps.scan.outputs.json }}
          SCANNED_IMAGE: ${{ matrix.image }}
          PATCHED_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from collections import Counter

          with open(os.environ['SCAN_REPORT'], encoding='utf-8') as report:
              matches = json.load(report)['matches']
          counts = Counter(
              (match['vulnerability']['severity'], match['vulnerability']['fix']['state'] == 'fixed')
              for match in matches
          )
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Image security scan\n\n')
              summary.write(f"`{os.environ['SCANNED_IMAGE']}`\n\n")
              if os.environ['PATCHED_TARGET']:
                  summary.write(f"Gate applies to the rebuilt `{os.environ['PATCHED_TARGET']}` stage with image security hardening. Upstream findings are attached separately.\n\n")
              summary.write('| Severity | Fix available | No fix available |\n')
              summary.write('| --- | ---: | ---: |\n')
              for severity in ('Critical', 'High', 'Medium', 'Low', 'Negligible', 'Unknown'):
                  summary.write(f'| {severity} | {counts[severity, True]} | {counts[severity, False]} |\n')
              summary.write('\nHigh/Critical findings with a fix block this job. ')
              summary.write('Findings without a fix remain visible and are not considered resolved. ')
              summary.write('The complete Grype JSON report is attached as an artifact.\n')
          PY
      - name: Upload complete vulnerability report
        if: ${{ !cancelled() && steps.scan.outputs.json != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-image-scan-${{ strategy.job-index }}
          path: |
            ${{ steps.scan.outputs.json }}
            upstream-grype-report.json
          if-no-files-found: error
          retention-days: 14

  typesense:
    name: Scan Typesense with OS security updates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build patched Typesense
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/typesense.Dockerfile
          load: true
          no-cache: true
          tags: omxfc-typesense:security-scan
      - name: Scan patched Typesense
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: omxfc-typesense:security-scan
          grype-version: v0.121.0
          fail-build: true
          severity-cutoff: high
          output-format: table
