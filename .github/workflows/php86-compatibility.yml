name: PHP 8.6 Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: php86-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: PHP 8.6 stufenweise prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      status: ${{ steps.probe.outputs.status }}
      label: ${{ steps.probe.outputs.label }}
      summary: ${{ steps.probe.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: PHP 8.6 bereitstellen
        id: php
        continue-on-error: true
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.6'
          update: true
          coverage: none
          extensions: uri, pdo_sqlite, sqlite3, pdo_mysql, mbstring, intl, zip, gd, exif, sockets, pcntl, bcmath
          tools: composer:2.11.1@sha256:6f1b891e1d4927d62740276c540fb490e47689e19e102c49e8da849794882f8c
      - name: Composer-Downloads wiederverwenden
        if: steps.php.outcome == 'success'
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/php86-composer-cache/files
          key: ${{ runner.os }}-php-8.6-composer-downloads-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.6-composer-downloads-
      - name: Isolierte Arbeitskopie anlegen
        run: |
          mkdir -p "$RUNNER_TEMP/php86-probe"
          # git archive excludes .github via export-ignore; tests need all tracked files.
          git checkout-index --all --prefix="$RUNNER_TEMP/php86-probe/"
      - name: Abhängigkeiten, PHP, MariaDB und Browser nacheinander prüfen
        id: probe
        env:
          PHP_SETUP_OUTCOME: ${{ steps.php.outcome }}
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/php86-composer-cache
        run: |
          export COMPOSER_BINARY
          COMPOSER_BINARY="$(command -v composer || true)"
          node tools/ci/php86-compatibility.mjs "$RUNNER_TEMP/php86-probe" "$RUNNER_TEMP/php86-reports"
      - name: Diagnoseartefakte sichern
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php86-compatibility
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/php86-reports/
            ${{ runner.temp }}/php86-probe/test-results/
            ${{ runner.temp }}/php86-probe/playwright-report/
            ${{ runner.temp }}/php86-probe/tests/Browser/Traces/
            ${{ runner.temp }}/php86-probe/tests/Browser/Screenshots/

  report:
    name: 'PHP 8.6: ${{ needs.probe.outputs.label || ''nicht prüfbar'' }}'
    needs: [probe]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kompatibilitätsstatus zusammenfassen
        env:
          PROBE_SUMMARY: ${{ needs.probe.outputs.summary }}
        run: |
          if [ -n "$PROBE_SUMMARY" ]; then
            printf '%s\n' "$PROBE_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '## PHP 8.6: nicht prüfbar' '' 'Die Probe konnte keine vollständigen Ergebnisdaten bereitstellen. Bitte die Logs des Probe-Jobs prüfen.' >> "$GITHUB_STEP_SUMMARY"
          fi
