name: Mutation tests

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '35 3 * * 0'

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        env:
          update: 'true'
        with:
          php-version: '8.6'
          tools: composer:2.11.2@sha256:dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028
          coverage: none
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, exif, fileinfo, sockets
      - name: Verify PHP 8.6 security minimum
        run: php tools/ci/verify-php86.php
      - name: Install pinned PHP 8.6 coverage driver
        run: |
          sh tools/ci/install-xdebug.sh "$RUNNER_TEMP/php86-coverage"
          echo "PHP_INI_SCAN_DIR=:$RUNNER_TEMP/php86-coverage" >> "$GITHUB_ENV"
          echo "XDEBUG_MODE=coverage" >> "$GITHUB_ENV"
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify monetary and progression assertions
        run: composer test:mutate:core

      - name: Run covered mutation tests
        if: github.event_name != 'pull_request'
        run: composer test:mutate
