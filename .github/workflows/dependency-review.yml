name: Dependency Review

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '35 4 * * 1'

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  dependency-audit:
    name: Lockfile validation and audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.5'
          tools: composer:2.10.3@sha256:7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6
          extensions: zip, sockets

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Validate Composer metadata and lockfile
        run: composer validate --no-check-publish --strict

      - name: Pin npm
        run: npm install --global npm@12.2.0 --ignore-scripts && test "$(npm --version)" = "12.2.0" && sh docker/patch-npm-security.sh

      - name: Audit Composer lockfile
        run: composer audit --locked --abandoned=fail

      - name: Verify Composer platform requirements
        run: composer check-platform-reqs --lock

      - name: Verify npm lockfile and install-script policy
        run: npm ci

      - name: Inventory unreviewed npm install scripts
        run: npm install-scripts ls

      - name: Audit npm lockfile
        run: npm audit --package-lock-only --audit-level=moderate

      - name: Check npm registry signatures (best effort)
        continue-on-error: true
        run: npm audit signatures
