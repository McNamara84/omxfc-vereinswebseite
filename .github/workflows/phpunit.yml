name: PHP Tests and Quality
run-name: '${{ github.workflow }} @ ${{ github.sha }}'

on:
  merge_group:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: phpunit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pest_quality:
    runs-on: ubuntu-latest
    name: PHP Static Analysis and Architecture

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        env:
          update: 'true'
        with:
          php-version: '8.6'
          coverage: none
          tools: composer:2.11.2@sha256:dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028
          extensions: intl, zip, sockets
      - name: Verify PHP 8.6 security minimum
        run: php tools/ci/verify-php86.php
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.6-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.6-composer-
            ${{ runner.os }}-php-8.6-
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
      - name: Run PHPStan for migrated Pest tests
        run: composer test:types
      - name: Verify PHP source compatibility
        run: composer test:compatibility
      - name: Verify Pest Rector migration
        run: composer test:rector
      - name: Run architecture and security rules
        run: composer test:arch
      - name: Run profanity scan
        run: composer test:profanity

  tests:
    runs-on: ubuntu-latest
    name: PHP Tests (shard ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        env:
          update: 'true'
        with:
          php-version: '8.6'
          tools: composer:2.11.2@sha256:dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028
          extensions: gd, exif, zip, sockets
          coverage: none
          ini-values: xdebug.mode=coverage
      - name: Verify PHP 8.6 security minimum
        run: php tools/ci/verify-php86.php
      - name: Install pinned PHP 8.6 coverage driver
        run: |
          sh tools/ci/install-xdebug.sh "$RUNNER_TEMP/php86-coverage"
          echo "PHP_INI_SCAN_DIR=:$RUNNER_TEMP/php86-coverage" >> "$GITHUB_ENV"
          echo "XDEBUG_MODE=coverage" >> "$GITHUB_ENV"
      - name: Generate ephemeral application key
        run: php -r "file_put_contents(getenv('GITHUB_ENV'), 'APP_KEY=base64:'.base64_encode(random_bytes(32)).PHP_EOL, FILE_APPEND);"
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.6-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.6-composer-
            ${{ runner.os }}-php-8.6-
            ${{ runner.os }}-
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-8.6-composer-cache-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.6-composer-cache-
            ${{ runner.os }}-php-8.6-
            ${{ runner.os }}-
      - name: Cache PHPUnit result cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .phpunit.cache
          key: ${{ runner.os }}-php-8.6-phpunit-shard-${{ matrix.shard }}-${{ hashFiles('phpunit.xml', 'composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.6-phpunit-shard-${{ matrix.shard }}-
            ${{ runner.os }}-php-8.6-
            ${{ runner.os }}-
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
      - name: Setup Node.js and build assets
        uses: ./.github/actions/build-assets
      - name: Execute time-balanced Pest shard
        env:
          DB_CONNECTION: sqlite
          # Match phpunit.xml; inherited process variables also populate $_SERVER.
          DB_DATABASE: ':memory:'
        # The temporary Xdebug alpha needs more time than the former stable driver.
        run: ./vendor/bin/pest --shard=${{ matrix.shard }}/2 --compact --timeout=3600 --coverage-clover=coverage/php-${{ matrix.shard }}.xml --coverage-php=coverage/php-${{ matrix.shard }}.php --log-junit=coverage/php-${{ matrix.shard }}-tests.xml
      - name: Upload PHP coverage shard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-coverage-shard-${{ matrix.shard }}
          path: coverage/
          if-no-files-found: error

  maddraxikon_mariadb:
    runs-on: ubuntu-latest
    name: Application Database Tests
    services:
      mariadb:
        image: mariadb:13.0.2@sha256:54f493ea0d60b621a5bff84e5b20100f8b86b6efa6b79158e04756c5194a5e4d
        env:
          MARIADB_DATABASE: omxfc_maddraxikon_test
          MARIADB_USER: omxfc_test
          MARIADB_PASSWORD: omxfc_test_password
          MARIADB_ROOT_PASSWORD: omxfc_root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -u root
          -pomxfc_root_test_password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: omxfc_maddraxikon_test
      DB_USERNAME: omxfc_test
      DB_PASSWORD: omxfc_test_password

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        env:
          update: 'true'
        with:
          php-version: '8.6'
          coverage: none
          tools: composer:2.11.2@sha256:dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028
          extensions: pdo_mysql, zip, sockets
      - name: Verify PHP 8.6 security minimum
        run: php tools/ci/verify-php86.php
      - name: Generate ephemeral application key
        run: php -r "file_put_contents(getenv('GITHUB_ENV'), 'APP_KEY=base64:'.base64_encode(random_bytes(32)).PHP_EOL, FILE_APPEND);"
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.6-mariadb-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.6-mariadb-composer-
            ${{ runner.os }}-php-8.6-composer-
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
      - name: Setup Node.js and build assets
        uses: ./.github/actions/build-assets
      - name: Verify fresh MariaDB migrations
        run: php artisan migrate:fresh --force
      - name: Execute Maddraxikon tests on MariaDB
        run: php vendor/bin/pest --configuration=phpunit.mariadb.xml --fail-on-skipped --compact

  rpg_mariadb:
    runs-on: ubuntu-latest
    name: RPG Database Concurrency
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:13.0.2@sha256:54f493ea0d60b621a5bff84e5b20100f8b86b6efa6b79158e04756c5194a5e4d
        env:
          MARIADB_DATABASE: omxfc_rpg_test
          MARIADB_USER: omxfc_test
          MARIADB_PASSWORD: omxfc_test_password
          MARIADB_ROOT_PASSWORD: omxfc_root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -u root
          -pomxfc_root_test_password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    # Job-level environment is also inherited by the independent PHP workers.
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: omxfc_rpg_test
      DB_USERNAME: omxfc_test
      DB_PASSWORD: omxfc_test_password

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        env:
          update: 'true'
        with:
          php-version: '8.6'
          tools: composer:2.11.2@sha256:dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028
          extensions: pdo_mysql, intl, zip, sockets
          coverage: none
      - name: Verify PHP 8.6 security minimum
        run: php tools/ci/verify-php86.php
      - name: Generate ephemeral application key
        run: php -r "file_put_contents(getenv('GITHUB_ENV'), 'APP_KEY=base64:'.base64_encode(random_bytes(32)).PHP_EOL, FILE_APPEND);"
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.6-mariadb-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.6-mariadb-composer-
            ${{ runner.os }}-php-8.6-composer-
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
      - name: Execute RPG concurrency tests on MariaDB
        # RefreshDatabase creates the schema in this isolated database.
        # A misconfigured connection must fail the job instead of silently skipping.
        run: php vendor/bin/pest --configuration phpunit.rpg-mariadb.xml --fail-on-skipped --compact

  veranstaltungs_baxx_mariadb:
    runs-on: ubuntu-latest
    name: Veranstaltungs-Baxx Database Concurrency
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:13.0.2@sha256:54f493ea0d60b621a5bff84e5b20100f8b86b6efa6b79158e04756c5194a5e4d
        env:
          MARIADB_DATABASE: omxfc_veranstaltungen_test
          MARIADB_USER: omxfc_test
          MARIADB_PASSWORD: omxfc_test_password
          MARIADB_ROOT_PASSWORD: omxfc_root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -u root
          -pomxfc_root_test_password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    # Job-level environment is also inherited by the independent PHP workers.
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: omxfc_veranstaltungen_test
      DB_USERNAME: omxfc_test
      DB_PASSWORD: omxfc_test_password

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        env:
          update: 'true'
        with:
          php-version: '8.6'
          tools: composer:2.11.2@sha256:dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028
          extensions: pdo_mysql, intl, zip, sockets
          coverage: none
      - name: Verify PHP 8.6 security minimum
        run: php tools/ci/verify-php86.php
      - name: Generate ephemeral application key
        run: php -r "file_put_contents(getenv('GITHUB_ENV'), 'APP_KEY=base64:'.base64_encode(random_bytes(32)).PHP_EOL, FILE_APPEND);"
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.6-mariadb-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.6-mariadb-composer-
            ${{ runner.os }}-php-8.6-composer-
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
      - name: Execute Veranstaltungs-Baxx concurrency tests on MariaDB
        # RefreshDatabase creates the schema in this isolated database.
        # A misconfigured connection must fail the job instead of silently skipping.
        run: php vendor/bin/pest --configuration phpunit.veranstaltungs-baxx-mariadb.xml --fail-on-skipped --compact

  browser_preview:
    runs-on: ubuntu-latest
    name: Modal Preview Regression

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        env:
          update: 'true'
        with:
          php-version: '8.6'
          coverage: none
          tools: composer:2.11.2@sha256:dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028
          extensions: zip, sockets
      - name: Verify PHP 8.6 security minimum
        run: php tools/ci/verify-php86.php
      - name: Generate ephemeral application key
        run: php -r "file_put_contents(getenv('GITHUB_ENV'), 'APP_KEY=base64:'.base64_encode(random_bytes(32)).PHP_EOL, FILE_APPEND);"
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.6-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.6-composer-
            ${{ runner.os }}-php-8.6-
            ${{ runner.os }}-
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-8.6-composer-cache-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.6-composer-cache-
            ${{ runner.os }}-php-8.6-
            ${{ runner.os }}-
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite
      - name: Setup Node.js and build assets
        uses: ./.github/actions/build-assets
      - name: Install Playwright browser dependencies
        run: npx playwright install-deps chromium
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Prepare Pest browser artifact directories
        # Pest Browser removes these paths; PHPUnit 13.4 reports a missing
        # trace directory as a warning even when the plugin uses @rmdir().
        run: mkdir -p tests/Browser/Screenshots/Sliders tests/Browser/Screenshots/ImageDiffView tests/Browser/Traces
      - name: Execute Pest browser preview regression
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        # Keep the Pest/PHPUnit order explicit and reproducible for this browser regression.
        run: ./vendor/bin/pest tests/Browser/ModalBackdropPreviewTest.php --order-by=random --random-order-seed=1 --display-all-issues

  coverage:
    needs: [tests]
    runs-on: ubuntu-latest
    name: PHP Coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Match the revision executed by the shards, including the PR merge.
          ref: ${{ github.sha }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        env:
          update: 'true'
        with:
          php-version: '8.6'
          tools: composer:2.11.2@sha256:dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028
          extensions: zip, sockets
          coverage: none
      - name: Verify PHP 8.6 security minimum
        run: php tools/ci/verify-php86.php
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.6-composer-${{ hashFiles('composer.lock') }}
      - run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Download both PHP coverage shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: php-coverage-shard-*
          path: coverage/shards
          merge-multiple: true
      - name: Merge coverage without rerunning tests
        run: php tools/testing/php-coverage.php coverage/php-snapshot.json coverage/shards/php-1.php coverage/shards/php-2.php --clover=coverage.xml
      - name: Fetch protected PR baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Reject coverage regressions
        run: |
          node tools/testing/check-coverage.mjs tests/coverage-baselines/php.json coverage/php-snapshot.json
          node tools/testing/check-coverage.mjs tests/coverage-baselines/php-pest-modernization-before.json coverage/php-snapshot.json
          node tools/testing/check-coverage.mjs tests/coverage-baselines/php86-modernization-before.json coverage/php-snapshot.json
      - name: Create PHP coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node tools/testing/php-coverage-badge.mjs coverage/php-snapshot.json badge-output/php-coverage.svg
      - name: Upload PHP coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-coverage-report
          path: coverage.xml
          if-no-files-found: error
      - name: Upload PHP coverage snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-coverage-snapshot
          path: coverage/php-snapshot.json
          if-no-files-found: error
      - name: Upload PHP coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-coverage-badge
          path: badge-output/php-coverage.svg
          if-no-files-found: error

  js-coverage:
    # Reuse the successful Vitest measurements from this exact main revision.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    needs:
      - tests
    runs-on: ubuntu-latest
    name: Import JavaScript Coverage
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
      - name: Find the successful Vitest push for this revision
        id: vitest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/find-vitest-coverage.mjs
      - name: Download existing JavaScript measurements and badge
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-coverage-publication
          run-id: ${{ steps.vitest.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: js-publication
      - name: Upload JS coverage summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-coverage-summary
          path: js-publication/coverage-summary.json
          if-no-files-found: error
      - name: Upload JS coverage badge
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-coverage-badge
          path: js-publication/js-coverage.svg
          if-no-files-found: error

  deploy-coverage:
    name: Publish Coverage Reports and Badges
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    needs:
      - coverage
      - js-coverage
    runs-on: ubuntu-latest

    steps:
      - name: Download PHP coverage badge
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: php-coverage-badge
          path: artifacts/php/badge
      - name: Download JS coverage badge
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-coverage-badge
          path: artifacts/js/badge
      - name: Download JS coverage summary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-coverage-summary
          path: artifacts/js/summary
      - name: Download PHP coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: php-coverage-report
          path: artifacts/php/report
      - name: Prepare deployment directory
        run: |
          mkdir -p output/coverage
          cp artifacts/php/badge/php-coverage.svg output/php-coverage.svg
          cp artifacts/js/badge/js-coverage.svg output/js-coverage.svg
          cp artifacts/js/summary/coverage-summary.json output/coverage/coverage-summary.json
          cp artifacts/php/report/coverage.xml output/coverage.xml
      - name: Deploy coverage artifacts to image-data branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          publish_dir: ./output
          publish_branch: image-data
          github_token: ${{ secrets.GITHUB_TOKEN }}
