version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 8
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      livewire-ui-stack:
        patterns:
          - laravel/jetstream
          - livewire/livewire
          - robsontenorio/mary
        update-types:
          - patch
          - minor
      pest-stack:
        patterns:
          - pestphp/*
          - phpunit/phpunit
          - nunomaduro/collision
          - rector/rector
      production-patch-and-minor:
        dependency-type: production
        exclude-patterns:
          - laravel/jetstream
          - livewire/livewire
          - robsontenorio/mary
        update-types:
          - patch
          - minor
      development-patch-and-minor:
        dependency-type: development
        exclude-patterns:
          - pestphp/*
          - phpunit/phpunit
          - nunomaduro/collision
          - rector/rector
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 8
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      browser-test-stack:
        patterns:
          - "@playwright/test"
          - "@axe-core/playwright"
      vitest-stack:
        patterns:
          - vitest
          - "@vitest/*"
          - jsdom
      frontend-ui-stack:
        patterns:
          - "@alpinejs/*"
          - "@tailwindcss/*"
          - alpinejs
          - daisyui
          - tailwindcss
          - vite
          - laravel-vite-plugin
        update-types:
          - patch
          - minor
      npm-patch-and-minor:
        patterns:
          - "*"
        exclude-patterns:
          - "@alpinejs/*"
          - "@tailwindcss/*"
          - alpinejs
          - daisyui
          - tailwindcss
          - vite
          - laravel-vite-plugin
          - "@playwright/test"
          - "@axe-core/playwright"
          - vitest
          - "@vitest/*"
          - jsdom
        update-types:
          - patch
          - minor

  - package-ecosystem: docker
    directories:
      - /
      - /docker
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:35"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
