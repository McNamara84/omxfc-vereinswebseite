name: omxfc-tests

services:
  assets:
    image: ${TEST_NODE_IMAGE:-omxfc-test-node:local}
    entrypoint: ['sh', '/source/docker/tests/start-php.sh']
    working_dir: /var/www/html
    command: ['node', 'node_modules/vite/bin/vite.js', 'build']
    environment:
      TEST_USE_SHARED_ASSETS: '1'
    volumes:
      - .:/source:ro
      - assets:/var/www/html/public/build

  node:
    image: ${TEST_NODE_IMAGE:-omxfc-test-node:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: test-node
    entrypoint: ['sh', '/source/docker/tests/start-php.sh']
    working_dir: /var/www/html
    volumes:
      - .:/source:ro

  browser:
    image: ${TEST_BROWSER_IMAGE:-omxfc-test-browser:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: test-browser
    entrypoint: ['sh', '/source/docker/tests/start-php.sh']
    working_dir: /var/www/html
    environment:
      APP_ENV: testing
      TEST_USE_SHARED_ASSETS: '1'
      PLAYWRIGHT_WORKERS: ${PLAYWRIGHT_WORKERS:-1}
      PLAYWRIGHT_REUSE_EXISTING_SERVER: ${PLAYWRIGHT_REUSE_EXISTING_SERVER:-0}
    volumes:
      - .:/source:ro
      - assets:/var/www/html/public/build:ro

  php:
    image: ${TEST_PHP_IMAGE:-omxfc-test-php:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    entrypoint: ['sh', '/source/docker/tests/start-php.sh']
    working_dir: /var/www/html
    environment:
      APP_ENV: testing
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: omxfc_test
      DB_PASSWORD: omxfc_test_password
      MADDRAXIKON_IDENTITY_HMAC_PEPPERS: test-v1:0123456789abcdef0123456789abcdef
      TEST_USE_SHARED_ASSETS: '1'
    volumes:
      - .:/source:ro
      - assets:/var/www/html/public/build:ro

  db:
    image: mariadb:13.0.2@sha256:0e4bb0f339feba125d1154fbacd36c16ec8518f52e44e1f82ecec7d6771caf39
    environment:
      MARIADB_ROOT_PASSWORD: omxfc_root_test_password
      MARIADB_DATABASE: omxfc_maddraxikon_test
      MARIADB_USER: omxfc_test
      MARIADB_PASSWORD: omxfc_test_password
    volumes:
      - ./docker/tests/databases.sql:/docker-entrypoint-initdb.d/test-databases.sql:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD', 'mariadb-admin', 'ping', '-h', '127.0.0.1', '-uroot', '-pomxfc_root_test_password']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  assets:
